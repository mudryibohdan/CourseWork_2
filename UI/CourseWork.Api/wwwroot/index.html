<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Туристична агенція</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="css/site.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">TravelAgency</a>
            <div class="d-flex gap-2 align-items-center">
                <span id="userInfo" class="text-white small"></span>
                <button id="loginBtn" class="btn btn-light btn-sm" data-bs-toggle="modal" data-bs-target="#authModal">Увійти</button>
                <button id="logoutBtn" class="btn btn-outline-light btn-sm d-none">Вийти</button>
            </div>
        </div>
    </nav>

    <main class="container py-4">
        <ul class="nav nav-tabs mb-3" id="mainTabs">
            <li class="nav-item"><button class="nav-link active" data-tab="tours">Тури</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="hot">Гарячі тури</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="bookings">Мої бронювання</button></li>
            <li class="nav-item"><button class="nav-link" data-tab="tickets">Квитки / Готелі</button></li>
            <li class="nav-item d-none" id="manageTabItem"><button class="nav-link" data-tab="manage">Керування турами</button></li>
        </ul>

        <section id="toursSection" class="tab-panel">
            <div class="row g-3 mb-3">
                <div class="col-md-4"><input id="searchInput" class="form-control" placeholder="Пошук..."></div>
                <div class="col-md-2">
                    <select id="typeFilter" class="form-select">
                        <option value="">Усі типи</option>
                        <option value="0">Екскурсійний</option>
                        <option value="1">Пляжний</option>
                        <option value="2">Гірськолижний</option>
                        <option value="3">Круїз</option>
                        <option value="4">Культурний</option>
                    </select>
                </div>
                <div class="col-md-2"><button id="searchBtn" class="btn btn-primary w-100">Знайти</button></div>
            </div>
            <div id="toursList" class="row g-3"></div>
        </section>

        <section id="hotSection" class="tab-panel d-none"></section>
        <section id="bookingsSection" class="tab-panel d-none"></section>
        <section id="ticketsSection" class="tab-panel d-none"></section>
        <section id="manageSection" class="tab-panel d-none">
            <form id="tourForm" class="row g-3">
                <div class="col-md-6"><input name="title" class="form-control" placeholder="Назва туру" required></div>
                <div class="col-md-6"><input name="price" type="number" class="form-control" placeholder="Ціна" required></div>
                <div class="col-12"><textarea name="description" class="form-control" placeholder="Опис" required></textarea></div>
                <div class="col-md-3"><input name="countryId" type="number" class="form-control" placeholder="ID країни" required></div>
                <div class="col-md-3"><input name="availablePlaces" type="number" class="form-control" placeholder="Місця" required></div>
                <div class="col-md-3"><input name="startDate" type="date" class="form-control" required></div>
                <div class="col-md-3"><input name="endDate" type="date" class="form-control" required></div>
                <div class="col-md-3">
                    <select name="type" class="form-select">
                        <option value="0">Екскурсійний</option>
                        <option value="1">Пляжний</option>
                        <option value="4">Культурний</option>
                    </select>
                </div>
                <div class="col-md-3 form-check pt-2"><input name="isHot" type="checkbox" class="form-check-input" id="isHot"><label for="isHot" class="form-check-label">Гарячий тур</label></div>
                <div class="col-12"><button class="btn btn-success">Створити тур</button></div>
            </form>
        </section>
    </main>

    <div class="modal fade" id="authModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header"><h5 class="modal-title">Авторизація</h5><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div>
                <div class="modal-body">
                    <ul class="nav nav-pills mb-3">
                        <li class="nav-item"><button class="nav-link active" id="loginTab">Вхід</button></li>
                        <li class="nav-item"><button class="nav-link" id="registerTab">Реєстрація</button></li>
                    </ul>
                    <form id="loginForm">
                        <input id="loginEmail" class="form-control mb-2" placeholder="Email" type="email" required>
                        <input id="loginPassword" class="form-control mb-2" placeholder="Пароль" type="password" required>
                        <button class="btn btn-primary w-100">Увійти</button>
                    </form>
                    <form id="registerForm" class="d-none">
                        <input id="regEmail" class="form-control mb-2" placeholder="Email" type="email" required>
                        <input id="regPassword" class="form-control mb-2" placeholder="Пароль" type="password" required>
                        <input id="regFirstName" class="form-control mb-2" placeholder="Ім'я" required>
                        <input id="regLastName" class="form-control mb-2" placeholder="Прізвище" required>
                        <button class="btn btn-success w-100">Зареєструватися</button>
                    </form>
                    <div id="authError" class="text-danger mt-2"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
